name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Python extension cannot link as a test binary on macOS; the
      # Python wheel job builds and tests it.
      - run: cargo test --workspace --all-features --exclude pencil-puzzles-python
      - run: cargo test -p pencil-puzzles --no-default-features --features all-genres

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Every library crate must build for the browser.
      - run: cargo build -p pencil-puzzles --all-features --target wasm32-unknown-unknown

  msrv:
    name: Rust 1.88 (K5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  wasm-tests:
    name: WebAssembly tests (T8)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: cargo test -p pencil-puzzles-aquarium --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-binairo --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-chocona --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-fillomino --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-hashi --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-hitori --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-kakurasu --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-kakuro --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-nurikabe --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: cargo test -p pencil-puzzles-sudoku --target wasm32-unknown-unknown --test wasm --all-features --locked
      - run: node web/build.mjs
      - run: node --test web/tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # The site must also work under a subpath, as on GitHub Pages.
      - run: node web/build.mjs
        env:
          BASE_PATH: /pencil-puzzles/
      - run: |
          grep -q '<base href="/pencil-puzzles/">' web/dist/index.html
          grep -q '<base href="/pencil-puzzles/">' web/dist/sudoku/player/index.html

  python:
    name: Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # One abi3 wheel per platform serves CPython 3.10 and newer.
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.10.2"
          command: build
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
      - run: python -m pip install --no-index --find-links dist pencil-puzzles
      # Tests import the installed wheel, not the source tree.
      - run: python -m unittest discover -s python/tests -v

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b dirhtml -d target/doctrees docs docs-site

  lint:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
