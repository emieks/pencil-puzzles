[build-system]
requires = ["maturin==1.10.2"]
build-backend = "maturin"

[project]
name = "pencil-puzzles"
version = "0.4.0"
description = "Generate, solve, rate and check pencil puzzles such as sudoku and nurikabe, with difficulty set by the human techniques they need"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "python/README.md"
keywords = ["puzzle", "sudoku", "nurikabe", "kakurasu", "fillomino", "hashi", "hitori", "kakuro", "aquarium", "binairo", "takuzu", "chocona", "generator", "solver", "difficulty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.urls]
Homepage = "https://pencil-puzzles.org/"
Documentation = "https://pencil-puzzles.org/docs/"
Source = "https://github.com/emieks/pencil-puzzles"
Issues = "https://github.com/emieks/pencil-puzzles/issues"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "pencil_puzzles._native"
features = ["extension-module"]
