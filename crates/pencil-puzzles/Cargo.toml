[package]
name = "pencil-puzzles"
description = "Generators, solvers and difficulty raters for pencil puzzles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["puzzle", "logic-puzzle", "solver", "generator", "sudoku"]
categories = ["games", "algorithms"]

[features]
default = ["all-genres"]
# Every genre. Turn off default features and pick genres to build less.
all-genres = ["aquarium", "binairo", "fillomino", "hashi", "hitori", "kakurasu", "kakuro", "nurikabe", "sudoku"]
aquarium = ["dep:pencil-puzzles-aquarium"]
binairo = ["dep:pencil-puzzles-binairo"]
fillomino = ["dep:pencil-puzzles-fillomino"]
hashi = ["dep:pencil-puzzles-hashi"]
hitori = ["dep:pencil-puzzles-hitori"]
kakurasu = ["dep:pencil-puzzles-kakurasu"]
kakuro = ["dep:pencil-puzzles-kakuro"]
nurikabe = ["dep:pencil-puzzles-nurikabe"]
sudoku = ["dep:pencil-puzzles-sudoku"]
# Serialize and deserialize puzzles, solutions and ratings with serde.
serde = ["dep:serde", "dep:serde_json", "pencil-puzzles-core/serde", "pencil-puzzles-aquarium?/serde", "pencil-puzzles-binairo?/serde", "pencil-puzzles-fillomino?/serde", "pencil-puzzles-hashi?/serde", "pencil-puzzles-hitori?/serde", "pencil-puzzles-kakurasu?/serde", "pencil-puzzles-kakuro?/serde", "pencil-puzzles-sudoku?/serde", "pencil-puzzles-nurikabe?/serde"]

[dependencies]
pencil-puzzles-core.workspace = true
pencil-puzzles-aquarium = { workspace = true, optional = true }
pencil-puzzles-binairo = { workspace = true, optional = true }
pencil-puzzles-fillomino = { workspace = true, optional = true }
pencil-puzzles-hashi = { workspace = true, optional = true }
pencil-puzzles-hitori = { workspace = true, optional = true }
pencil-puzzles-kakurasu = { workspace = true, optional = true }
pencil-puzzles-kakuro = { workspace = true, optional = true }
pencil-puzzles-nurikabe = { workspace = true, optional = true }
pencil-puzzles-sudoku = { workspace = true, optional = true }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
