[package]
name = "pencil-puzzles-core"
description = "Code shared by the pencil-puzzles genres: the difficulty scale, the solve and generator loops, text and ID formats, and a seeded random number generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["puzzle", "logic-puzzle", "difficulty", "generator"]
categories = ["games"]

[features]
# Serialize and deserialize shared types with serde.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
